services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: walangbrownout_ims
      MYSQL_USER: ims_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes: [dbdata:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uims_app -p$$MYSQL_PASSWORD"]
      interval: 5s
      retries: 20
  api:
    build: .
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
    volumes: [".:/app", "vendor:/app/vendor"]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_KEY: ${APP_KEY:?run php artisan key:generate --show and set APP_KEY in .env}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: walangbrownout_ims
      DB_USERNAME: ims_app
      DB_PASSWORD: ${DB_PASSWORD}
      FRONTEND_URL: http://localhost:5173
      ADMIN_NAME: System Admin
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      CACHE_STORE: file
      PHP_CLI_SERVER_WORKERS: "4"
    command: >
      sh -c "mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
      && ([ -f vendor/autoload.php ] || composer install --no-interaction)
      && php artisan migrate --force
      && ([ -f storage/.seeded ] || (php artisan db:seed --force && touch storage/.seeded))
      && php artisan serve --host=0.0.0.0 --port=8000"
volumes:
  dbdata:
  vendor:
